<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contacta con el Club Abismo para unirte a una expedición.">
  <meta name="author" content="Club de Espeleología Abismo">
  <title>Contacto | Club Abismo</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <h1 class="logo">🔦 Club Abismo</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="expediciones.html">Expediciones</a>
      <a href="contacto.html">Contacto</a>
      <a href="login.html">Acceso socios</a>
      <input type="checkbox" id="tema" class="oculto">
      <label for="tema" class="btn-tema">🌓 Cambiar tema</label>
    </nav>
  </header>
  <main>
    <h2>Únete a una expedición</h2>
    <form action="#" method="post">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" required minlength="3">

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" name="correo" required>

      <label for="expedicion">Expedición de interés</label>
      <select id="expedicion" name="expedicion" required>
        <option value="">Selecciona una opción</option>
        <option>Cueva de Santo Tomás</option>
        <option>Cueva del Indio</option>
        <option>Cuevas de Bellamar</option>
      </select>

      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="5" required minlength="10"></textarea>

      <div class="fila-check">
        <input type="checkbox" id="experiencia" name="experiencia">
        <label for="experiencia">Tengo experiencia previa en cuevas</label>
      </div>

      <button type="submit">Enviar solicitud</button>
    </form>
    <img class="ilustracion" src="img/sede.svg" alt="Mapa ilustrado con un punto rojo que marca la sede del club">
    <address>
      <strong>Sede del club:</strong> Carretera a Cueva del Indio, km 2, Viñales, Pinar del Río, Cuba.
    </address>
  </main>
  <footer>
    <p>&copy; 2026 Club de Espeleología Abismo. Todos los derechos reservados.</p>
    <p><a href="https://instagram.com">Instagram</a> | <a href="https://facebook.com">Facebook</a></p>
  </footer>
</body>
</html>
