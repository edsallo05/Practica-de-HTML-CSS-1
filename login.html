<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicia sesión como socio del Club Abismo.">
  <meta name="author" content="Club de Espeleología Abismo">
  <title>Acceso socios | Club Abismo</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <h1 class="logo">🔦 Club Abismo</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="expediciones.html">Expediciones</a>
      <a href="contacto.html">Contacto</a>
      <a href="login.html">Acceso socios</a>
      <input type="checkbox" id="tema" class="oculto">
      <label for="tema" class="btn-tema">🌓 Cambiar tema</label>
    </nav>
  </header>
  <main>
    <h2>Acceso de socios</h2>
    <form action="#" method="post">
      <label for="usuario">Correo electrónico</label>
      <input type="email" id="usuario" name="usuario" required>

      <label for="clave">Contraseña</label>
      <input type="password" id="clave" name="clave" required minlength="6">

      <div class="fila-check">
        <input type="checkbox" id="recordar" name="recordar">
        <label for="recordar">Recordarme</label>
      </div>

      <button type="submit">Entrar</button>
      <p><a href="#">¿Olvidaste tu contraseña?</a></p>
      <p>¿No tienes cuenta? <a href="#">Regístrate</a></p>
    </form>
  </main>
  <footer>
    <p>&copy; 2026 Club de Espeleología Abismo. Todos los derechos reservados.</p>
    <p><a href="https://instagram.com">Instagram</a> | <a href="https://facebook.com">Facebook</a></p>
  </footer>
</body>
</html>
